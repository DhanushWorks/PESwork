<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .logo-mark {
      filter: none;
    }
    @media (prefers-color-scheme: dark) {
      .logo-mark {
        filter: invert(1) brightness(1.2);
      }
    }
  </style>
  <image class="logo-mark" width="64" height="64" href="data:image/png;base64," />
</svg>